<script>
"use strict";
// ═══════════ CONFIGURAÇÃO ═══════════
const CFG_DEFAULT={turmas:["5.º A","5.º B","5.º C","5.º D","5.º E","5.º F"],ativos:{m1:true,m2:true,m3:true,m4:true},minRegras:5,pw:"51619c240c05e48a7992d37fab9e8a239a4e82e2e52f21e9253fdbf920db7cb2"};
let CFG_PUB={};
try{CFG_PUB=JSON.parse(localStorage.getItem('erg5:cfgCache'))||{};}catch(e){}
const LSget=k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}};
const LSset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let CFG=Object.assign({},CFG_DEFAULT,CFG_PUB);
CFG.ativos=Object.assign({},CFG_DEFAULT.ativos,CFG.ativos||{});

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

const starsFromErrors=(e,a,b)=>e<=a?3:e<=b?2:1;

// ═══════════ ILUSTRAÇÕES (SVG) ═══════════
function scene(o){
  const P=Object.assign({back:'ok',seat:'ok',screen:'ok',dist:'ok',wrist:'ok',glare:false,face:'happy',pose:'sit',shirt:'#3E8ED0',pants:'#2F3E66',hair:'#5A3A22',skin:'#E9B48A',markers:null},o||{});
  const F=236,D=140;
  const seatY=P.seat==='high'?140:P.seat==='rest'?150:168;
  const slouch=P.back==='slouch';
  let hip=slouch?{x:106,y:seatY-6}:{x:92,y:seatY-6};
  let sh=slouch?{x:130,y:seatY-56}:{x:96,y:seatY-66};
  let head=slouch?{x:150,y:seatY-70}:{x:100,y:seatY-90};
  let tilt=0;
  if(P.screen==='low'&&!slouch){head={x:118,y:seatY-80};sh={x:100,y:seatY-64};tilt=1;}
  if(P.dist==='close'&&!slouch){head={x:122,y:seatY-86};sh={x:102,y:seatY-64};}
  let eye={x:head.x+9,y:head.y+(tilt?3:-1)};
  const idealEye=seatY-91;
  let sx=P.dist==='close'?166:P.screen==='low'?200:246;
  let top,h=56;
  if(P.screen==='low'){top=D-40;h=36;}else if(P.screen==='high'){top=idealEye-50;}else{top=idealEye-6;}
  const bottom=top+h;
  const kb0=150;
  const knee={x:hip.x+44,y:seatY-4};
  let foot={x:knee.x+2,y:knee.y+70};
  const onFloor=foot.y>=F-8;
  if(onFloor)foot.y=F-5;else if(P.seat!=='rest')foot.x=knee.x+10;
  let E=slouch?{x:sh.x+14,y:sh.y+40}:{x:sh.x+20,y:sh.y+40};
  let W,H;
  if(P.screen==='low'){W={x:sx-30,y:D-7};H={x:sx-16,y:D-7};}
  else{W={x:kb0+4,y:D-6};H={x:kb0+18,y:D-6};}
  if(P.wrist==='bent'){E={x:E.x,y:E.y+9};W={x:W.x,y:D-3};H={x:W.x+8,y:D-16};}
  const s=[];
  s.push(`<rect x="0" y="0" width="360" height="${F}" fill="#F1F7FA"/><rect x="0" y="${F}" width="360" height="24" fill="#E2CFB6"/><rect x="0" y="${F-4}" width="360" height="4" fill="#D2BB9C"/>`);
  if(P.glare){
    s.push(`<rect x="8" y="22" width="56" height="72" rx="4" fill="#BFE3F7" stroke="#8A9BB0" stroke-width="4"/><line x1="36" y1="22" x2="36" y2="94" stroke="#8A9BB0" stroke-width="3"/><circle cx="24" cy="40" r="9" fill="#F7C948"/>`);
  }
  if(P.pose==='stretch'){
    s.push(`<circle cx="236" cy="44" r="17" fill="#fff" stroke="#1D2B4F" stroke-width="3"/><line x1="236" y1="44" x2="236" y2="33" stroke="#1D2B4F" stroke-width="3" stroke-linecap="round"/><line x1="236" y1="44" x2="244" y2="48" stroke="#1D2B4F" stroke-width="3" stroke-linecap="round"/>`);
  }
  // cadeira
  s.push(`<rect x="52" y="${seatY-62}" width="9" height="60" rx="4" fill="#6B7A99"/><rect x="58" y="${seatY-4}" width="66" height="9" rx="4" fill="#6B7A99"/><rect x="88" y="${seatY+5}" width="7" height="${F-12-seatY-5}" fill="#8A97B2"/><rect x="64" y="${F-14}" width="56" height="5" rx="2" fill="#8A97B2"/><circle cx="68" cy="${F-5}" r="5" fill="#4A5570"/><circle cx="116" cy="${F-5}" r="5" fill="#4A5570"/>`);
  if(P.seat==='rest')s.push(`<rect x="${knee.x-16}" y="${foot.y+5}" width="44" height="${F-foot.y-5}" rx="3" fill="#C98B4E" stroke="#9C6735" stroke-width="2"/>`);
  // mesa
  s.push(`<rect x="148" y="${D+8}" width="7" height="${F-D-8}" fill="#A86F3A"/><rect x="306" y="${D+8}" width="7" height="${F-D-8}" fill="#B37940"/><rect x="140" y="${D}" width="180" height="8" rx="2" fill="#C98B4E"/>`);
  const ln=(a,b,c,w)=>`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  if(P.pose==='stretch'){
    const hx=118,hy=170;
    s.push(ln({x:hx-3,y:hy},{x:hx-5,y:F-6},P.pants,14)+ln({x:hx+4,y:hy},{x:hx+6,y:F-6},P.pants,14));
    s.push(`<ellipse cx="${hx+1}" cy="${F-5}" rx="11" ry="5" fill="#2E3440"/><ellipse cx="${hx+11}" cy="${F-5}" rx="11" ry="5" fill="#2E3440"/>`);
    s.push(ln({x:hx,y:hy},{x:hx,y:112},P.shirt,26));
    s.push(ln({x:hx-6,y:108},{x:hx-22,y:74},P.shirt,11)+ln({x:hx-22,y:74},{x:hx-28,y:42},P.skin,9));
    s.push(ln({x:hx+6,y:108},{x:hx+22,y:74},P.shirt,11)+ln({x:hx+22,y:74},{x:hx+28,y:42},P.skin,9));
    head={x:hx+2,y:86};eye={x:head.x+9,y:head.y-1};
  }else{
    s.push(ln(hip,knee,P.pants,17)+ln(knee,foot,P.pants,14));
    s.push(`<ellipse cx="${foot.x+7}" cy="${foot.y+1}" rx="11" ry="5" fill="#2E3440"/>`);
    if(slouch)s.push(`<path d="M${hip.x} ${hip.y} Q${hip.x-18} ${(hip.y+sh.y)/2+4} ${sh.x} ${sh.y}" stroke="${P.shirt}" stroke-width="26" fill="none" stroke-linecap="round"/>`);
    else s.push(ln(hip,sh,P.shirt,26));
  }
  // pescoço e cabeça
  s.push(ln({x:(P.pose==='stretch'?head.x-2:sh.x+2),y:(P.pose==='stretch'?100:sh.y)},{x:head.x-2,y:head.y+12},P.skin,9));
  s.push(`<circle cx="${head.x-3}" cy="${head.y-3}" r="18" fill="${P.hair}"/><circle cx="${head.x+2}" cy="${head.y+2}" r="15.5" fill="${P.skin}"/>`);
  if(P.face==='tired'){
    s.push(`<line x1="${eye.x-3}" y1="${eye.y}" x2="${eye.x+3}" y2="${eye.y+1}" stroke="#1D2B4F" stroke-width="2.4" stroke-linecap="round"/><path d="M${head.x+6} ${head.y+11} Q${head.x+10} ${head.y+8} ${head.x+14} ${head.y+11}" stroke="#1D2B4F" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M${head.x-8} ${head.y-22} q3 6 0 9 q-3 -3 0 -9z" fill="#7CC4F0"/>`);
  }else{
    s.push(`<circle cx="${eye.x}" cy="${eye.y}" r="2.4" fill="#1D2B4F"/><path d="M${head.x+5} ${head.y+8} Q${head.x+9} ${head.y+12} ${head.x+14} ${head.y+7}" stroke="#1D2B4F" stroke-width="2" fill="none" stroke-linecap="round"/>`);
  }
  // ecrã
  if(P.screen==='low'){
    s.push(`<rect x="${sx-36}" y="${D-5}" width="44" height="5" rx="2" fill="#5B6478"/><path d="M${sx-2} ${top} L${sx+20} ${top+6} L${sx+16} ${D-5} L${sx-4} ${D-5} Z" fill="#3A4256" stroke="#3A4256" stroke-width="3" stroke-linejoin="round"/><path d="M${sx+1} ${top+4} L${sx+17} ${top+9} L${sx+14} ${D-8} L${sx-1} ${D-8} Z" fill="#8FD3F5"/>`);
  }else{
    let books='';
    if(P.screen==='high'){const bh=D-(bottom+6);const cols=['#E05A47','#F4B63F','#138A7A','#3E8ED0'];let y=D;let i=0;while(y-12>=bottom+6&&i<6){books+=`<rect x="${sx-14}" y="${y-12}" width="48" height="12" rx="2" fill="${cols[i%4]}"/>`;y-=12;i++;}s.push(books);
      s.push(`<rect x="${sx+7}" y="${bottom-2}" width="5" height="${Math.max(0,y-bottom+2)}" fill="#3A4256"/><rect x="${sx-4}" y="${y-3}" width="28" height="3" rx="1" fill="#3A4256"/>`);}
    else s.push(`<rect x="${sx+7}" y="${bottom-2}" width="5" height="${D-bottom+2}" fill="#3A4256"/><rect x="${sx-4}" y="${D-4}" width="28" height="4" rx="2" fill="#3A4256"/>`);
    s.push(`<path d="M${sx-4} ${top} L${sx+22} ${top+8} L${sx+22} ${bottom-4} L${sx-4} ${bottom} Z" fill="#3A4256" stroke="#3A4256" stroke-width="4" stroke-linejoin="round"/><path d="M${sx-1} ${top+4} L${sx+19} ${top+10} L${sx+19} ${bottom-7} L${sx-1} ${bottom-4} Z" fill="#8FD3F5"/>`);
    if(P.pose!=='stretch'||true)s.push(`<rect x="${kb0}" y="${D-4}" width="34" height="4" rx="1.5" fill="#5B6478"/>${P.dist==='close'?'':`<ellipse cx="${kb0+44}" cy="${D-2}" rx="5" ry="2.5" fill="#5B6478"/>`}`);
  }
  if(P.glare){
    const fy=top+h/2;
    s.push(`<g stroke="#F4B63F" stroke-width="3" stroke-dasharray="6 6" opacity=".85"><line x1="64" y1="40" x2="${sx-4}" y2="${fy-14}"/><line x1="64" y1="62" x2="${sx-4}" y2="${fy}"/><line x1="64" y1="84" x2="${sx-4}" y2="${fy+14}"/></g><path d="M${sx-2} ${fy-12} l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3z" fill="#fff" stroke="#F4B63F" stroke-width="1.5"/>`);
  }
  if(P.pose!=='stretch'){
    s.push(ln(sh,E,'rgba(0,0,0,.22)',14)+ln(sh,E,P.shirt,11)+ln(E,W,P.skin,9)+ln(W,H,P.skin,9));
  }
  // marcadores (missão 3)
  if(P.markers){
    s.push(`<line x1="${eye.x+4}" y1="${eye.y}" x2="${sx-5}" y2="${eye.y}" stroke="#138A7A" stroke-width="2.5" stroke-dasharray="5 5"/>`);
    const M={1:{x:sx+36,y:top+8},2:{x:44,y:seatY-38},3:{x:E.x+4,y:E.y+20},4:{x:W.x+6,y:D-24},5:{x:foot.x+26,y:foot.y-12},6:{x:(eye.x+sx)/2,y:eye.y-16}};
    for(const k in M){const m=M[k];s.push(`<g class="mk"><circle cx="${m.x}" cy="${m.y}" r="12" fill="#138A7A" stroke="#fff" stroke-width="3"/><text x="${m.x}" y="${m.y+5}" text-anchor="middle" font-family="Baloo 2,Nunito,sans-serif" font-weight="800" font-size="15" fill="#fff">${k}</text></g>`);}
  }
  const spots={back:slouch?{x:hip.x-6,y:(hip.y+sh.y)/2}:{x:hip.x,y:(hip.y+sh.y)/2},feet:{x:foot.x+6,y:foot.y},wrist:{x:W.x+3,y:W.y-5},screen:{x:sx+9,y:top+h/2},window:{x:36,y:58},eyes:eye};
  const svg=`<svg viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(P.alt||'Ilustração de uma criança ao computador')}">${s.join('')}<g class="layer"></g></svg>`;
  return {svg,spots};
}

const CARDS=[
  {o:{},ok:true,cap:'O Tiago a fazer os trabalhos de casa.',why:'Costas apoiadas, pés no chão, cotovelos dobrados e ecrã à altura dos olhos.'},
  {o:{back:'slouch'},ok:false,cap:'A Ana a jogar no computador.',why:'As costas estão curvadas e longe da cadeira. Encosta as costas!'},

  {k:'back',n:'Costas curvadas'},{k:'feet',n:'Pés no ar'},{k:'wrist',n:'Pulsos dobrados'},{k:'screen',n:'Ecrã demasiado perto'},{k:'window',n:'Luz da janela no ecrã'}

  {k:1,t:'O topo do ecrã fica à altura dos olhos'},
  {k:2,t:'As costas ficam apoiadas na cadeira'},

const QUIZ=[
  {i:'📏',q:'A que distância deve ficar o ecrã dos teus olhos?',a:['Mais ou menos um braço esticado','Um palmo','Do outro lado da sala'],why:'Um braço esticado é a distância certa para os olhos não se cansarem.'},
  {i:'⏰',q:'Estás no computador há 30 minutos. O que fazes?',a:['Levanto-me, estico-me e mexo-me um pouco','Continuo sem parar até acabar','Chego-me mais perto do ecrã'],why:'Pausas curtas descansam as costas, os olhos e a cabeça.'},

const MISSIONS=[
  {id:'m1',n:'Certo ou errado?',d:'Olha para cada imagem e decide se a postura está certa.',th:{back:'slouch'}},
  {id:'m2',n:'Encontra os 5 erros',d:'Usa a lupa de detetive para descobrir o que está mal.',th:{back:'slouch',seat:'high',dist:'close',wrist:'bent',glare:true,face:'tired'}},
  {id:'m3',n:'Liga as regras',d:'Diz qual é a regra de cada número na imagem.',th:{markers:true}},
  {id:'m4',n:'Quiz da ergonomia',d:'Seis perguntas para provar que és um especialista.',th:{pose:'stretch'}},
  {id:'m5',n:'As minhas regras no Word',d:'Escreve as tuas próprias regras de ergonomia num documento.',th:{seat:'rest'},word:true}
];
const active=()=>MISSIONS.filter(m=>m.word||CFG.ativos[m.id]);

// ═══════════ ESTADO DO ALUNO ═══════════
const S={name:'',turma:'',key:'',prog:{},doc:null,screen:'home',unlockAll:false};
function load(){const d=LSget('erg5:p:'+S.key)||{};S.prog=d.prog||{};S.doc=d.doc||null;S.meta=d.meta||{};S.comentario='';}
function save(){S.meta=S.meta||{};S.meta.pending=true;LSset('erg5:p:'+S.key,{prog:S.prog,doc:S.doc,name:S.name,turma:S.turma,meta:S.meta});queueSync();}
const totalStars=()=>active().reduce((a,m)=>a+((S.prog[m.id]&&S.prog[m.id].stars)||0),0);
const allDone=()=>active().every(m=>S.prog[m.id]&&S.prog[m.id].done);
function setDone(id,stars,extra){const p=S.prog[id]||{};S.prog[id]=Object.assign(p,{done:true,stars:Math.max(p.stars||0,stars)},extra||{});save();}

// ═══════════ ECRÃS ═══════════
const main=()=>$('main');
function topbar(title){
  return `<div class="top"><h2>${esc(title)}</h2><span class="who">${esc(S.name)} | ${esc(S.turma)}</span><span class="stars" title="Estrelas">⭐ ${totalStars()}/${active().length*3}</span><button class="btn ghost small" data-go="map">Mapa</button></div>`;
}
function bindGo(root){root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g==='map')renderMap();else if(g==='home')renderHome();});}
function show(html,name){S.screen=name;main().innerHTML=html;bindGo(main());window.scrollTo(0,0);}

function renderHome(){
  const hero=scene(Object.assign({alt:'Criança sentada ao computador com boa postura'},KIDS[0])).svg;
  const lens=`<svg class="lens" viewBox="0 0 100 100" aria-hidden="true"><circle cx="40" cy="40" r="28" fill="#fff" fill-opacity=".55" stroke="#1D2B4F" stroke-width="8"/><line x1="61" y1="61" x2="90" y2="90" stroke="#1D2B4F" stroke-width="13" stroke-linecap="round"/></svg>`;
  show(`<div class="wrap"><div class="home">
    <div><h1>Detetives da Postura</h1><p class="sub">Ergonomia em TIC, 5.º ano. Descobre como te sentar bem ao computador e escreve as tuas próprias regras.</p>
      <div class="form">
        <div class="f"><label for="hName">O teu nome e apelido</label><input id="hName" type="text" autocomplete="off" maxlength="40" value="${esc(S.name)}"></div>
        <div class="f"><label for="hTurma">A tua turma</label><select id="hTurma"><option value="">Escolhe a turma</option>${CFG.turmas.map(t=>`<option ${t===S.turma?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
        <div class="msg" id="hMsg"></div>
        <button class="btn big" id="hGo">Começar</button>
      </div></div>
    <div class="hero">${hero}${lens}</div>
  </div></div>`,'home');
  const go=()=>{const n=$('hName').value.trim().replace(/\s+/g,' '),t=$('hTurma').value;
    if(n.split(' ').length<2){$('hMsg').textContent='Escreve o teu nome e o teu apelido.';return;}
    if(!t){$('hMsg').textContent='Escolhe a tua turma.';return;}
    S.name=n;S.turma=t;S.key=norm(n)+'|'+t;load();enterStudent();};
  $('hGo').onclick=go;$('hName').onkeydown=e=>{if(e.key==='Enter')go();};
}

function renderMap(){
  const ms=active();let prevDone=true;

// ── Missão 2: encontra os erros
function runSpots(){
  const sc=scene(Object.assign({},KIDS[1],{back:'slouch',seat:'high',dist:'close',wrist:'bent',glare:true,face:'tired',alt:'Criança ao computador com vários erros de postura'}));

  show(topbar('Missão: Encontra os 5 erros')+`<div class="wrap"><div class="mhead"><div class="tip">🔍 Este menino está a fazer tudo ao contrário! Clica nos 5 sítios onde há um erro.</div></div>
    <div class="card"><div class="spotwrap"><div class="scene" id="sp">${sc.svg}</div></div>
    <div class="found" id="fl">${SPOTS.map(s=>`<span data-k="${s.k}">❔ ${esc(s.n)}</span>`).join('')}</div>
    <p class="note" id="sMsg">Encontraste 0 de 5.</p><button class="btn ghost small" id="hint">Preciso de uma pista</button></div></div>`,'m2');
  const svg=$('sp').querySelector('svg'),layer=svg.querySelector('.layer');

  svg.addEventListener('click',e=>{
    const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());

      const n=Object.keys(found).length;$('sMsg').textContent=`Encontraste ${n} de 5.`;

}

// ── Missão 3: liga as regras

  rib.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{if(!needSel())return;cmd('foreColor',b.dataset.color);});
  $('wFont').onchange=e=>{if(needSel())cmd('fontName',e.target.value);};
  $('wSize').onchange=e=>{if(e.target.value)applySize(e.target.value);e.target.value='';};
  main().querySelectorAll('.w-tabs button.off').forEach(b=>b.onclick=()=>toast('Hoje só usamos o separador Base.'));
  $('wDone').onclick=()=>{const c=checkDoc();if(!c.tasks[0].ok)return;const extra=c.tasks.slice(1).filter(k=>k.ok).length;
    const st=extra===5?3:extra>=3?2:1;setDone('m5',st,{nRegras:c.valid.length,tarefas:extra});
    result('m5',st,extra===5?'O teu documento está perfeito!':`Cumpriste ${extra} de 5 tarefas de formatação. Podes voltar e melhorar.`);};
  afterEdit();renderTasks();
}
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount){const r=s.getRangeAt(0);if(zoneOf(r.commonAncestorContainer)&&zoneOf(r.startContainer)===zoneOf(r.endContainer)){savedRange=r.cloneRange();}}if(S.screen==='m5')ribbonState();});

function xmlEsc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rgbHex(c){const m=c.match(/\d+/g);if(!m)return'000000';return m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join('').toUpperCase();}
function runsOf(nodes,root){const out=[];nodes.forEach(nd=>{const list=nd.nodeType===3?[nd]:textNodes(nd);list.forEach(t=>{const e=t.parentElement,cs=getComputedStyle(e);let u=false,x=e;while(x&&x!==root){if(x.tagName==='U'||/underline/.test(x.style.textDecoration||''))u=true;x=x.parentElement;}
  const fam=cs.fontFamily.split(',')[0].replace(/["']/g,'').trim();
  out.push(`<w:r><w:rPr><w:rFonts w:ascii="${xmlEsc(fam)}" w:hAnsi="${xmlEsc(fam)}"/>${(cs.fontWeight==='bold'||parseInt(cs.fontWeight,10)>=600)?'<w:b/>':''}${cs.fontStyle==='italic'?'<w:i/>':''}<w:color w:val="${rgbHex(cs.color)}"/><w:sz w:val="${Math.round(parseFloat(cs.fontSize)*1.5)}"/>${u?'<w:u w:val="single"/>':''}</w:rPr><w:t xml:space="preserve">${xmlEsc(t.nodeValue.replace(/\s+/g,' '))}</w:t></w:r>`);});});return out.join('');}
function para(runs,align,prefix){const jc=align==='center'?'center':align==='right'?'right':'left';return `<w:p><w:pPr><w:spacing w:after="120"/><w:jc w:val="${jc}"/></w:pPr>${prefix?`<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial"/><w:sz w:val="24"/></w:rPr><w:t xml:space="preserve">${xmlEsc(prefix)}</w:t></w:r>`:''}${runs}</w:p>`;}
async function makeDocx(){
  const d=docBlocks(S.doc);const T=d.querySelector('#xT'),R=d.querySelector('#xR');
  const alignOf=n=>{let e=n.nodeType===3?n.parentElement:n;while(e&&e!==d&&getComputedStyle(e).display==='inline')e=e.parentElement;return getComputedStyle(e||T).textAlign;};
  const tn=textNodes(T);let body=para(runsOf([T],T),tn.length?alignOf(tn[0]):'left','');
  body+=para(`<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial"/><w:color w:val="555555"/><w:sz w:val="22"/></w:rPr><w:t xml:space="preserve">${xmlEsc('Nome: '+S.name+' | Turma: '+S.turma)}</w:t></w:r>`,'left','');
  blocks(R).forEach(b=>{const first=textNodes(b.nodes[0].nodeType===3?b.nodes[0].parentNode:b.nodes[0])[0];body+=para(runsOf(b.nodes,R),first?alignOf(first):'left',b.prefix);});
  d.remove();
  const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1701" w:bottom="1417" w:left="1701" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const z=new JSZip();
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/document.xml',docXml);
  return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
// ═══════════ LIGAÇÃO À FIREBASE ═══════════
let FB=null;
const FBP=new Promise(res=>{window.__fbResolve=res;setTimeout(()=>res(null),12000);}).then(f=>{FB=f;return f;});
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(36).padStart(7,'0');}
const docIdFor=(uid,key)=>uid+'_'+fnv(key)+fnv(key+'#');

// Lê o documento do aluno numa página escondida para extrair as regras e o título
function docBlocks(docObj){const d=document.createElement('div');d.style.cssText='position:absolute;left:-9999px;top:0;width:600px';d.className='page';
  d.innerHTML=`<div class="zone" id="xT">${clean((docObj||{}).title||'')}</div><div class="zone" id="xR">${clean((docObj||{}).rules||'')}</div>`;document.body.appendChild(d);return d;}

function payloadFrom(e){
  const f=FB,ms=active();
  const tmp=docBlocks(e.doc);const regras=blocks(tmp.querySelector('#xR')).map(b=>b.text.slice(0,300)).slice(0,30);const titulo=tmp.querySelector('#xT').textContent.trim().slice(0,200);tmp.remove();
  const prog={};let est=0;ms.forEach(m=>{const p=(e.prog||{})[m.id];prog[m.id]=p&&p.done?(p.stars||0):null;est+=prog[m.id]||0;});
  const entregue=ms.every(m=>e.prog&&e.prog[m.id]&&e.prog[m.id].done);
  return {uid:f.uid,nome:e.name.slice(0,60),nomeNorm:norm(e.name).slice(0,60),turma:e.turma.slice(0,20),prog,estrelas:est,estrelasMax:ms.length*3,
    regras,nRegras:(e.prog.m5||{}).nRegras||0,tarefas:(e.prog.m5||{}).tarefas||0,titulo,
    tituloHtml:clean((e.doc||{}).title||'').slice(0,3000),regrasHtml:clean((e.doc||{}).rules||'').slice(0,20000),
    entregue,estado:entregue?'entregue':'em_curso',validado:false,atualizado:f.serverTimestamp(),versao:1};
}
let syncState='idle',syncT=null;
function queueSync(){clearTimeout(syncT);syncT=setTimeout(()=>syncNow(),2500);}
async function syncNow(){
  if(!S.key)return false;const f=await FBP;if(!f){syncState='offline';updSync();return false;}
  const k='erg5:p:'+S.key,e=LSget(k);if(!e)return false;
  const id=(e.meta&&e.meta.docId)||docIdFor(f.uid,S.key);
  syncState='sending';updSync();
  try{await f.setDoc(f.doc(f.db,'entregas',id),payloadFrom(e),{merge:true});
    e.meta=Object.assign(e.meta||{},{docId:id,pending:false,synced:true});LSset(k,e);S.meta=e.meta;syncState='ok';updSync();return true;}
  catch(err){console.warn('Envio falhou',err);syncState=err&&err.code==='permission-denied'?'locked':'offline';updSync();return false;}
}
function updSync(){const el=$('syncBox');if(!el)return;
  el.innerHTML={sending:'<b>A enviar ao professor…</b>',ok:'✅ <b>Enviado ao professor.</b> Podes fechar o exercício.',
    offline:'⚠️ <b>Sem ligação à internet.</b> O trabalho ficou guardado neste computador e é enviado automaticamente na próxima vez que abrires o exercício. <button class="btn small" id="sRetry">Tentar outra vez</button>',
    locked:'🔒 <b>Este trabalho já foi validado pelo professor</b> e não pode ser alterado.',idle:''}[syncState]||'';
  el.className='feedback '+(syncState==='ok'||syncState==='locked'?'ok':syncState==='offline'?'bad':'');
  if($('sRetry'))$('sRetry').onclick=()=>syncNow();}

// Ao abrir: envia o que ficou pendente e apaga deste computador os trabalhos já validados (ou eliminados) pelo professor
async function sweep(){
  const f=await FBP;if(!f)return;let removed=0;
  const keys=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('erg5:p:'))keys.push(k);}}catch(e){return;}
  for(const k of keys){const e=LSget(k);if(!e||!e.name)continue;const key=k.slice(7);const id=(e.meta&&e.meta.docId)||docIdFor(f.uid,key);
    try{const snap=await f.getDoc(f.doc(f.db,'entregas',id));
      if(snap.exists()&&snap.data().validado){localStorage.removeItem(k);removed++;continue;}
      if(!snap.exists()&&e.meta&&e.meta.synced&&!e.meta.pending){localStorage.removeItem(k);removed++;continue;}
      if(e.meta&&e.meta.pending){await f.setDoc(f.doc(f.db,'entregas',id),payloadFrom(e),{merge:true});e.meta=Object.assign(e.meta,{docId:id,pending:false,synced:true});LSset(k,e);}
    }catch(err){console.warn('Verificação falhou',k,err);}}
  if(removed)console.info(removed+' trabalho(s) validado(s) removido(s) deste computador.');
}
// Configuração do professor (turmas, missões, regras mínimas)
FBP.then(async f=>{if(!f)return;try{const s=await f.getDoc(f.doc(f.db,'config','geral'));if(s.exists()){const c=s.data();LSset('erg5:cfgCache',c);
  CFG=Object.assign({},CFG_DEFAULT,c);CFG.ativos=Object.assign({},CFG_DEFAULT.ativos,c.ativos||{});if(S.screen==='home')renderHome();else if(S.screen==='map')renderMap();}}catch(e){}
  sweep();});

async function enterStudent(){
  const f=await Promise.race([FBP,new Promise(r=>setTimeout(()=>r(FB),2500))]);
  if(f){try{const id=(S.meta&&S.meta.docId)||docIdFor(f.uid,S.key);const snap=await f.getDoc(f.doc(f.db,'entregas',id));
    if(snap.exists()){const d=snap.data();
      if(d.validado){try{localStorage.removeItem('erg5:p:'+S.key);}catch(e){}renderValidated(d);return;}
      if(d.estado==='devolvido'&&d.comentario)S.comentario=d.comentario;}}catch(e){}}
  renderMap();
}
function renderValidated(d){
  show(`<div class="wrap"><div class="card center" style="max-width:620px;margin:40px auto"><h1 style="font-size:40px">✅ Trabalho validado</h1>
   <p style="font-weight:700;font-size:19px">${esc(S.name)}, o professor já validou o teu trabalho de ergonomia.</p>
   <div class="bigstars">⭐ ${d.estrelas||0}/${d.estrelasMax||15}</div>${d.comentario?`<p class="tip" style="text-align:left">💬 ${esc(d.comentario)}</p>`:''}
   <p class="note">Os teus dados foram apagados deste computador.</p><button class="btn" id="vBack">Voltar ao início</button></div></div>`,'validated');
  $('vBack').onclick=()=>{S.name='';S.turma='';S.key='';renderHome();};
}

// ═══════════ ENTREGA ═══════════
function renderDeliver(){
  if(!allDone()){renderMap();return;}
  const tmp=docBlocks(S.doc);const rules=blocks(tmp.querySelector('#xR'));tmp.remove();
  show(topbar('Entrega')+`<div class="wrap"><div class="deliver">
   <div class="ticket"><h3>As minhas regras de ergonomia</h3><p style="margin:4px 0 0"><b>${esc(S.name)}</b> | ${esc(S.turma)} | ${new Date().toLocaleDateString('pt-PT')}</p><p style="margin:2px 0">⭐ ${totalStars()} de ${active().length*3} estrelas</p>
    <ol class="rules">${rules.map(b=>`<li>${esc(b.text)}</li>`).join('')}</ol></div>
   <div class="card"><h3 style="font-size:24px;margin-bottom:10px">Entrega ao professor</h3><div id="syncBox"></div>
    <p class="note" style="margin-top:12px">Ainda podes voltar às missões e melhorar o teu trabalho até o professor o validar. As alterações são enviadas sozinhas.</p>
    <div class="mbtns" style="justify-content:flex-start">${window.JSZip?'<button class="btn sun" id="dDocx">⬇️ Descarregar o meu documento Word</button>':''}</div></div>
  </div></div>`,'deliver');
  syncState='sending';updSync();syncNow();
  if($('dDocx'))$('dDocx').onclick=async()=>{try{const blob=await makeDocx();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Ergonomia - '+S.name+'.docx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}catch(e){toast('Não foi possível criar o documento.');}};
}

// ═══════════ ARRANQUE ═══════════
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('on');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('on');});
renderHome();

<script type="module">
import { firebaseConfig } from './firebase-config.js';
const V='10.12.2';
try{
  if(!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith('COLE'))throw new Error('Falta configurar firebase-config.js');
  const {initializeApp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const {getAuth,signInAnonymously,onAuthStateChanged}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const {getFirestore,doc,getDoc,setDoc,serverTimestamp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
  const user=await new Promise((res,rej)=>{const off=onAuthStateChanged(auth,u=>{if(u){off();res(u);}});signInAnonymously(auth).catch(rej);});
  window.__fbResolve({db,doc,getDoc,setDoc,serverTimestamp,uid:user.uid});
}catch(e){console.warn('Firebase indisponível:',e);window.__fbResolve(null);}
</script>
